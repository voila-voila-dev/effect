name: Main

# Everything that happens when `main` moves: the checks run, the packages go to
# public npm at one shared version, and both sites redeploy to their production
# Cloudflare Workers.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packages to npm'
        type: boolean
        default: true

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). Harmless when publishing with a
  # token instead.
  id-token: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint, type-check and test
        uses: ./.github/actions/run-checks

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    if: github.event_name == 'push' || inputs.publish
    env:
      # Monotonic and zero-maintenance. Swap this for Changesets once the API is
      # stable enough that a semver bump means something. 1.1.x, not 0.0.x:
      # @voila.dev/ui had 1.0.0–1.0.19 published then unpublished, and npm
      # 409s a revived package at versions below its unpublished history.
      PUBLISH_VERSION: 1.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Every package publishes at the same version, so the `workspace:*`
      # cross-deps bun resolves at pack time always line up.
      - name: Stamp the shared version
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            manifest="${dir}package.json"
            [ -f "$manifest" ] || continue
            node -e '
              const fs = require("node:fs");
              const file = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.private) process.exit(0);
              pkg.version = process.env.PUBLISH_VERSION;
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, "\t")}\n`);
              console.log(`${pkg.name}@${pkg.version}`);
            ' "$manifest"
          done

      # Resolves the workspace links so `bun publish` can substitute concrete
      # versions for `workspace:*` and `catalog:` in the tarball.
      # Not frozen: the version stamp above edits the manifests on purpose.
      - name: Install dependencies
        run: bun install

      # Consumers never install devDependencies, and one of them
      # (@voila.dev/typescript-config) is private and unpublished, so leaving
      # them in the tarball manifest is noise at best.
      - name: Drop devDependencies from the published manifests
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            manifest="${dir}package.json"
            [ -f "$manifest" ] || continue
            node -e '
              const fs = require("node:fs");
              const file = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.private) process.exit(0);
              delete pkg.devDependencies;
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, "\t")}\n`);
            ' "$manifest"
          done

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Order matters only for readability: npm has no install-time ordering
      # requirement, and all versions are identical anyway.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          for name in ui-tokens ui ui-chart ui-map ui-datatable ui-spreadsheet ui-filter ui-landing ui-email-block-editor; do
            dir="packages/$name"
            [ -d "$dir" ] || { echo "::warning::$dir not found, skipping"; continue; }
            echo "::group::@voila.dev/$name@$PUBLISH_VERSION"
            (cd "$dir" && bun publish --access public)
            echo "::endgroup::"
          done

      - name: Clean up the npm token
        if: always()
        run: rm -f .npmrc

  deploy:
    name: Deploy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storybook.ui.voila.dev
            label: storybook.ui.voila.dev
          - app: ui.voila.dev
            label: ui.voila.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and deploy
        uses: ./.github/actions/deploy-site
        with:
          app: ${{ matrix.app }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
