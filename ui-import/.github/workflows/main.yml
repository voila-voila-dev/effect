name: Main

# Everything that happens when `main` moves: the checks run, @voila.dev/ui goes
# to public npm, and both sites redeploy to their production Cloudflare Workers.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish @voila.dev/ui to npm'
        type: boolean
        default: true

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). Harmless when publishing with a
  # token instead.
  id-token: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint, type-check and test
        uses: ./.github/actions/run-checks

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    if: github.event_name == 'push' || inputs.publish
    env:
      # Monotonic and zero-maintenance: the patch is the run number, so every
      # push publishes. The major is bumped by hand when a release breaks
      # callers — 2.0 is the configurable email editor (see CHANGELOG.md).
      # Not 0.0.x: @voila.dev/ui had 1.0.0–1.0.19 published then unpublished,
      # and npm 409s a revived package below its unpublished history.
      PUBLISH_VERSION: 2.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Writes PUBLISH_VERSION into the manifest before install so `catalog:`
      # refs resolve to concrete versions in the tarball.
      - name: Stamp the version
        run: node scripts/publish-manifests.mjs stamp

      - name: Install dependencies
        run: bun install

      # dist/ is what the published exports point at: per-file ESM + .d.ts
      # mirrored from src/, so the glob exports and tree-shaking still work.
      - name: Build
        run: bun x turbo run build --filter='./packages/*'

      # Points exports at dist/ and drops devDependencies.
      - name: Finalize the published manifest
        run: node scripts/publish-manifests.mjs finalize

      - name: Publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          cd packages/ui && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Clean up the npm token
        if: always()
        run: rm -f .npmrc

  deploy:
    name: Deploy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storybook.ui.voila.dev
            label: storybook.ui.voila.dev
          - app: ui.voila.dev
            label: ui.voila.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and deploy
        uses: ./.github/actions/deploy-site
        with:
          app: ${{ matrix.app }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
