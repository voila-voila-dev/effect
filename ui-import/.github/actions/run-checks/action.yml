name: 'Run checks'
description: 'Install dependencies and run the repo lint / type-check / test suite.'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: ./.github/actions/setup-bun

    # Vite 7 (apps/ui.voila.dev) requires Node >= 22.12.
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '23.8.0'

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - name: Lint & format (Biome)
      shell: bash
      run: bun run ci

    - name: Type check
      shell: bash
      run: bun run check-types

    # Catches a <PropTable of="…"> that names nothing and internal links that
    # 404 — the drift the generated tables exist to prevent.
    - name: Check docs
      shell: bash
      run: bun run check-docs

    - name: Test
      shell: bash
      run: bun run test
